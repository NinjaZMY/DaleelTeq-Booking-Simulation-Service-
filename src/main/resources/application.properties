# ===========================
# Spring Boot Application Configuration
# DaleelTeq Booking Simulation Service
# ===========================

# Application name and port
spring.application.name=DaleelTeq-Booking-Service
server.port=8080
server.servlet.context-path=/

# ===========================
# Database Configuration
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_db
spring.datasource.username=${DB_USERNAME:user_not_found}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL18Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===========================
# DevTools Configuration
# ===========================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/
spring.devtools.restart.exclude=**/static/**, **/public/**, **/templates/**, **/META-INF/maven/**, **/META-INF/resources/**, **/resources/**, **/META-INF/**, **/logback.xml, **/logback-spring.xml

# ===========================
# Thymeleaf Configuration
# ===========================
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===========================
# Time Window Configuration
# Default: 09:00 to 16:00
# Can be overridden via environment variables
# ===========================
app.time-window.start=09:00
app.time-window.end=16:00

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.daleelteq=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
